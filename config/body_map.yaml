# Maps EMR concepts -> 3D organ ids used by the Case Analysis view (SPEC v1.1 §16.3 V7b).
# Organ ids MUST match node names in frontend/public/models/body.glb.
organs:
  skin:            {label: "Skin / whole body", system: integument}
  muscles:         {label: "Muscles", system: musculoskeletal}
  skeleton:        {label: "Skeleton", system: musculoskeletal}
  brain:           {label: "Brain", system: nervous}
  oesophagus:      {label: "Oesophagus", system: digestive}
  stomach:         {label: "Stomach", system: digestive}
  duodenum:        {label: "Duodenum", system: digestive}
  small_intestine: {label: "Small intestine", system: digestive}
  large_intestine: {label: "Large intestine", system: digestive}
  liver:           {label: "Liver", system: digestive}
  gallbladder:     {label: "Gallbladder", system: digestive}
  pancreas:        {label: "Pancreas", system: digestive}
  spleen:          {label: "Spleen", system: lymphatic}
  lymph_nodes:     {label: "Perigastric lymph nodes", system: lymphatic}
  kidney_l:        {label: "Left kidney", system: urinary}
  kidney_r:        {label: "Right kidney", system: urinary}
  heart:           {label: "Heart", system: circulatory}
  vessels:         {label: "Blood vessels", system: circulatory}
  lung_l:          {label: "Left lung", system: respiratory}
  lung_r:          {label: "Right lung", system: respiratory}

# Stomach sub-regions (lesion location concept 5003 answers)
stomach_regions:
  7120: cardia
  7121: body
  7122: antrum
  7123: diffuse

