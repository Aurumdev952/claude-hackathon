seed: 42
scale: 1.0
time:
  history_start: 2015-01-01
  history_end: 2026-06-30
  sim_start: 2026-07-01
population:
  n_patients_base: 1500000
  female_share: 0.515
  migration_rate_adults: 0.04
  chunk_size: 25000
  # routine acute OPD visits are thinned so scale 1.0 fits this container's disk (~50M obs); see D-17
  background_visit_factor: 0.5
  # D-23: the INS-1b decoy and INS-5 districts are enlarged so their district-level findings rise above Poisson noise
  district_weight_multiplier: {SOU-NYG: 2.5, WES-RUS: 2.0}
facilities:
  go_live_start: 2015-01-01
  go_live_end: 2019-12-31
  hp_testing_tier_shares: {low: 0.45, medium: 0.35, high: 0.20}
  n_health_centres: 200
gi:
  target_cohort_size: 50000
  dyspepsia_incidence_adult: 0.06     # true incidence (SPEC §8.6)
  recorded_episode_rate: 0.0063       # episodes that reach a recorded GI visit; tuned to the 50k cohort target
gastric_cancer:
  # SPEC §8.8 anchors (0.5/5/25/60 at 30/45/60/75) give median age at dx ~67 and young share ~7% in this pyramid,
  # outside the §8.8 targets (median 58-62) and the ~21% young-onset share in §14.3. Flattened (D-04):
  h0_anchor_per_100k: {30: 2.3, 45: 9.8, 60: 22.0, 75: 31.0}
  h0_multiplier: 1.0
  rr: {male: 2.1, hp: 3.0, hp_eradicated_floor: 1.6, atrophy_im: 3.5,
       smoker_current: 1.6, smoker_former: 1.2, alcohol_heavy: 1.3,
       high_salt: 1.5, smoked_food: 1.4, family_hx: 2.5, hiv: 1.0}
  sojourn_mean_months: 18
  # symptomatic-phase stage durations (gamma shape 2), months. SPEC says 5/5/6 but that cannot give both a
  # 7-10 month diagnostic interval and 45-55% stage IV (D-06); tuned to the outcome targets.
  stage_months: [3.6, 3.6, 4.5]
  terminal_admission_prob: 0.75
  untreated_iv_survival_months: 9
  prodrome_months: [6, 24]
  pct_clinical_only: 0.04   # + terminal clinical diagnoses at DH -> ~12% probable overall
  pct_never_diagnosed: 0.06
  targets: {confirmed_cases: [2000, 3000], stage_iv_pct: [45, 55], national_asr_2024: 12}
  # SPEC §8.8 targets conflict: ASR 12 in this young pyramid gives ~90 cases/yr at scale 1.0, while the case-count
  # targets (2,000-3,000 confirmed; ~1 dx every 1-2 days; 402 cases/yr in §14.3) need ASR ~30-33.
  # We calibrate to the case counts (statistical power for INS-1..8). See docs/decisions.md D-03.
  calibration: {target_asr_2024: 32, diag_fraction: 0.85, onset_reference_year: 2022}
  trend_lag_years: 2.0
  rr_hp_young: 1.3
  rr_male_young: 1.05
insights:
  ins1: {enabled: true, districts: [WES-NYB, NOR-MUS, WES-RUT], hp_prev: 0.78,
         smoked_food_prev: 0.55, high_salt_prev: 0.55, residual_rr: 2.0,   # D-23: 1.4 gave 2.0x national ASR
         spillover_rr: 1.35,  # D-24: bordering districts (highland belt) so the cluster is contiguous
         micro_cluster: {district: NOR-MUS, sector: auto, rr: 2.5}}
  ins1b: {enabled: true, district: SOU-NYG, age60plus_multiplier: 2.2}
  ins2: {enabled: true, age_lt: 50, start_year: 2019, annual_multiplier: 1.08,
         older_annual_multiplier: 1.01}
  ins3: {enabled: true}
  ins4: {enabled: true}
  ins5: {enabled: true, district: WES-RUS, endoscopy_from: 2021-07-01,
         pre_access_terminal_dx: 0.5, pre_access_workup_dx: 0.6,   # D-24: 0.35/0.45/0.2 gave +185%
         pre_access_referral_completion: 0.3}   # without local endoscopy many cases die undiagnosed
  ins6: {enabled: true, provinces: [EAS, SOU], misattribution_prob: 0.45,   # SPEC value; delay comes from suppression (D-25)
         suppress_days: [330, 480], anchor_after: 0.3}
  ins7: {enabled: true}
  ins8: {enabled: true, factor: hiv}
quality_noise:
  birthdate_estimated: 0.20
  hb_gL_units: {rate: 0.02, n_facilities: 5}
  duplicate_patients: 0.005
  voided_obs: 0.01
  amended_labs: 0.003
  c16_miscode: 0.03
  future_dated: 0.0005
simulator:
  tick_seconds: 300
  sim_days_per_tick: 1
  demo: {tick_seconds: 30, sim_days_per_tick: 7}
