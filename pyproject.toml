[project]
name = "early-signals"
version = "1.1.0"
description = "Early Signals - gastric cancer trend & risk intelligence on a synthetic OpenMRS EMR (Rwanda)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<2.3",
  "polars>=1.0",
  "pyarrow>=15",
  "pyyaml>=6",
  "duckdb==1.5.5",
  "duckdb-extensions==1.5.5",
  "duckdb-extension-mysql-scanner==1.5.5",
  "duckdb-extension-json==1.5.5",
  "pymysql>=1.1",
  "apscheduler>=3.10,<4",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "lifelines>=0.28",
  "libpysal>=4.10",
  "esda>=2.5",
  "shapely>=2.0",
  "scikit-learn>=1.4",
  "xgboost-cpu>=3.0",   # same library without the 0.5 GB multi-GPU NCCL dependency (CPU-only deployment)
  "shap>=0.45",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "sqlglot>=23",
  "httpx>=0.27",
  "orjson>=3.9",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70"]   # only needed when LLM_PROVIDER=anthropic
dl = ["jax==0.10.2", "jaxlib==0.10.2", "optax>=0.2.4"]   # D-18: JAX instead of PyTorch (CUDA wheels too large for this disk)
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "insights: ground-truth recovery tests (need a seeded dataset)",
  "llm: tests that need a live LLM (skipped by default)",
  "slow: slow tests",
]
